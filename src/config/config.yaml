# models
# -----------
# depth models
model_name: "dino" # choices=["pixio", "dino", "monodepth2"]
monodepth2:
  encoder_weights_path: "weights/monodepth2/mono_640x192/encoder.pth"
  decoder_weights_path: "weights/monodepth2/mono_640x192/depth.pth"
  num_layers: 18 # choices=[18, 50]
  pretrained: True
  scales: [0, 1, 2, 3] 
pixio:
  weights_path: null
  encoder: "pixio_vitb16" # choices=["pixio_vitb16", "pixio_vitl16", "pixio_vith16"]
  pretrained_ckp: null
  scales: [0, 1, 2, 3] 
litemono:
  model_type: "lite-mono" # choices=["lite-mono", "lite-mono-8m"]
  encoder_weights_path: "weights/litemono/encoder.pth"
  decoder_weights_path: "weights/litemono/depth.pth"
  scales: [0, 1, 2]
diffnet:
  encoder_weights_path: "weights/diffnet/encoder.pth"
  decoder_weights_path: "weights/diffnet/depth.pth"
  scales: [0, 1, 2, 3]
monovit:
  encoder_weights_path: "weights/monovit/encoder.pth"
  decoder_weights_path: "weights/monovit/depth.pth"
cadepth:
  num_layers: 50
  encoder_weights_path: "weights/cadepth/encoder.pth"
  decoder_weights_path: "weights/cadepth/depth.pth"
dino:
  encoder_size: "small" # choices=["small", "base", "large"]
  decoder_channels: 256
  freeze_encoder: True # if set, freezes the DINOv3 encoder during training (only trains the decoder). Ignored when use_jepa=True.
  encoder_weights_path: "tensorboard/train/jepa_small/20260220-112633/models/weights_epoch_19/context_encoder.pth"
  decoder_weights_path: "tensorboard/train/jepa_small/20260220-112633/models/weights_epoch_19/depth_decoder.pth"
  weights_path: "tensorboard/train/dino/20260228-224926/models/weights_epoch_19/depth_model.pth" # if set, will load the entire model from this path instead of loading encoder and decoder separately (used for non-JEPA models where encoder and decoder are not saved separately).
  scales: [0, 1, 2, 3] 
# pose models
resnet_pose_cnn:
  weights_path: null
  num_layers: 18
  pretrained: True
  num_input_images: 2
  num_input_features: 1 
  num_frames_to_predict_for: 2
simple_pose_cnn:
  weights_path: null


# misc
# -----------
data_path: 'data/kitti/kitti_data'
htmls_path: 'htmls'
tensorboard_path: 'tensorboard'
image_path_inference: 'src/inference/input_images/img1.jpg'
                     # I can also give an entire folder with images, not just one image!
                     # choices: ['src/inference/input_images/img1.jpg',
                     #           'src/inference/input_images']
num_workers: 8
im_sz: [192, 640] # [320, 1024], [192, 640] -> H W
bs: 12


# training
# -----------
num_epochs: 20 # number of epochs for training.
training_split: "eigen_zhou" # which training split to use;  choices=["eigen_zhou", "eigen_full", "benchmark"]
learning_rate: 0.0001 # 1e-4
scheduler_step_size: 15 # step size of the scheduler used for training.
scheduler_gamma: 0.1 # multiplicative factor of learning rate decay in scheduler.
weight_decay: 0.01 # 1e-2
clip_grad_norm: null # if set, clips gradient norm to this value. If null, no clipping is performed.
use_stereo_training: False # if set, uses stereo pair for training.
frame_ids_training: [0, -1, 1] # frames to use for training (current, previous and next); choices: [0, -1, 1], [0, 1]
pose_model_input: "pairs" # how many images the pose network gets; choices=["pairs", "all"]
load_pretrained_depth_model: False # if set, uses pretrained encoder and depth decoder for training (both of them!).
load_pretrained_pose_model: False # if set, uses pretrained PoseNet for training.
train_from_png: False # if set, trains from raw KITTI png files (instead of jpgs).
save_frequency: 1 # number of epochs between each save.
log_frequency: 10 # number of batches between each tensorboard log.
separate_plots: False # if set, logs each input and warped image separately (instead of concatenating them into a single image).
use_fixed_vis_samples: False  # If True, use same images for all tensorboard logs.
num_tensorboard_samples: 4 # Number of samples to visualize in tensorboard.
pose_model_type: resnet_pose_cnn # choices=["simple_pose_cnn", "resnet_pose_cnn"]
disparity_smoothness_weight: 0.001 # 1e-3
use_ssim: True # if set, uses SSIM in the loss. 
monodepthv1_multiscale: False # if set, uses Monodepthv1 multiscale. 
disable_automasking: False # if set, doesn't do auto-masking.
use_average_reprojection: False # if set, uses average reprojection loss; otherwise use minimum reprojection loss as described in "Diging into Self-Supervised MDE"
loss_scales: [0, 1, 2, 3] # scales used in the loss; choices: [0]; [0, 1, 2, 3]
min_depth: 0.1 # 0.01, 0.1
max_depth: 100.0 # 80.0, 100.0


# evaluation
# -----------
evaluation_split: eigen # choices=["eigen", "eigen_benchmark", "benchmark"]
evaluation_mode: mono # choices=["mono", "stereo"]
evaluation_post_process: False # if set will perform the flipping post processing from the original Monodepth paper (https://arxiv.org/pdf/1609.03677, pg.5, bottom-right).
prediction_depth_scale_factor: 1 # if set multiplies predictions by this number.
numpy_disparities_to_evaluate: null # optional path to a .npy disparities file to evaluate.
evaluate_eigen_to_benchmark: False # if set assume we are loading eigen results from .npy but we want to evaluate using the new benchmark.
disable_median_scaling: False # if set disables median scaling in evaluation.
html_max_samples: 3  # Number of sample images to include in HTML evaluation reports.
make3d_dataset_path: 'data/make3d' # path to Make3D dataset for evaluation.
cityscapes_dataset_path: 'data/cityscapes' # path to Cityscapes dataset for evaluation.


# JEPA-style training (Joint-Embedding Predictive Architecture)
# -----------
# When enabled, uses a separate ViT encoder (context encoder) + depth decoder architecture:
#   - Context Encoder (ViT from I-JEPA) -> Depth Decoder -> Disparity prediction -> Photometric loss (with input images)
#   - Context Encoder -> Predictor -> JEPA loss (with Target Encoder)
use_jepa_training: False  # Set to true to enable JEPA-style masked prediction training
jepa:
  # Encoder network
  encoder_size: "small"  # choices: ["small", "base", "large"]
  encoder_weights_path: "weights/dino/dinov3_vits16.pth"  # Path to pretrained DINOv3 weights

  # Decoder configuration
  depth_decoder_channels: 256  # Number of channels in the depth decoder (after lateral projections)
  
  # Training configuration
  loss_weight: 1.0  # Weight for JEPA loss relative to photometric loss (1.0 = equal weighting)
  
  # Masking strategy
  patch_size: 16  # Patch size for masking (should match encoder patch size).
  enc_mask_scale: [0.85, 1.0]  # Context mask scale: each context block covers 85-100% of image patches
  pred_mask_scale: [0.15, 0.2]  # Target mask scale: each prediction block covers 15-20% of image patches  
  aspect_ratio: [0.75, 1.5]  # Aspect ratio range for rectangular masks
  num_enc_masks: 1  # Number of context masks per image 
  num_pred_masks: 4  # Number of target masks per image 
  allow_overlap: False  # Allow overlap between context and target masks
  min_keep: 10  # Minimum number of patches to keep in masks
  
  # Predictor network (small transformer for masked region prediction)
  predictor_depth: 12  # Number of transformer layers in predictor (6-12 typical)
  predictor_emb_dim: 384  # Hidden dimension of predictor network
  
  # EMA (Exponential Moving Average) for target encoder  
  ema: [0.996, 1.0]  # Momentum schedule [start, end]. Higher = slower updates.

  # Ablation: representation vs pixel prediction
  #  - "representation" (default, I-JEPA style): loss computed on encoder patch tokens -> abstract targets
  #  - "pixel": loss computed on reconstructed image patches -> pixel-level targets (expected to be worse)
  prediction_space: "representation"  # choices: ["representation", "pixel"]
  use_pretrained: True # if set, uses ImageNet pretrained encoder and predictor for JEPA training. If false, both encoder and predictor are initialized randomly.

